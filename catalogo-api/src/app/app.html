<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/products" aria-label="Modern Store, inicio">
      <span class="brand__icon" aria-hidden="true">M</span>
      <span>modern<span class="brand__accent">store</span></span>
    </a>

    <nav class="navigation" aria-label="Navegación principal">
      <a
        routerLink="/products"
        routerLinkActive="navigation__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Catálogo
      </a>

      <a
        routerLink="/cart"
        routerLinkActive="navigation__link--active"
      >
        Carrito
        <span class="cart-badge">{{ cart.totalItems() }}</span>
      </a>

      @if (auth.isAuthenticated()) {
        <a
          routerLink="/admin"
          routerLinkActive="navigation__link--active"
        >
          Administración
        </a>

        <button class="navigation__logout" type="button" (click)="logout()">
          Salir
        </button>
      } @else {
        <a
          routerLink="/login"
          routerLinkActive="navigation__link--active"
        >
          Acceso admin
        </a>
      }
    </nav>

    <span class="topbar__tag">ONLINE STORE</span>
  </header>

  <main class="main-content">
    <router-outlet />
  </main>

  <footer class="footer">
    <p>Modern Store · Proyecto de catálogo con Angular</p>
  </footer>
</div>
